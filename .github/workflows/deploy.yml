- name: Instalar Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Instalar dependencias
    run: npm install

  - name: Construir proyecto (Build)
    run: npm run build

  - name: Publicar en GitHub Pages
    uses: peaceiris/actions-gh-pages@v3
    with:
      github_token: ${{ secrets.GITHUB_TOKEN }}
      publish_dir: ./dist
